name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check, money tests, database break-in tests
        run: npm run check
      - name: The Android bundle builds
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/android-export
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
